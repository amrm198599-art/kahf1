name: Build APK & AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q SuratAlKahf-project.zip -d src
          ls -la src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore (إن وُجدت الأسرار)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::لا يوجد مفتاح توقيع، سيتم التوقيع بمفتاح debug (للتجربة فقط)."
          fi

      - name: Build release APK + AAB
        working-directory: src
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp src/app/build/outputs/apk/release/*.apk dist/SuratAlKahf.apk
          cp src/app/build/outputs/bundle/release/*.aab dist/SuratAlKahf.aab

      - uses: actions/upload-artifact@v4
        with:
          name: SuratAlKahf-release
          path: dist/*
